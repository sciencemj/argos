<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Argos LMS 연결</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Argos · LearningX</h1>
  <p>고려대 LMS에 로그인한 탭에서 학습 정보를 가져와요.</p>
  <form id="settings">
    <label>Argos 주소<input id="server" type="url" value="http://127.0.0.1:8000" required></label>
    <label>연결 코드<input id="token" type="password" autocomplete="off" required></label>
    <label class="check"><input id="auto" type="checkbox" checked> 로그인 후 자동 수집 · 15분마다 갱신</label>
    <label class="check"><input id="materials" type="checkbox"> 주차학습 자료도 저장 · 파일당 최대 25MB</label>
    <button type="submit">연결 저장</button>
  </form>
  <div class="actions"><button id="sync">지금 수집</button><button id="attendance">현재 출결 표 가져오기</button></div>
  <button id="disconnect">연결 해제</button>
  <p>학습자료는 과목 피드에 첨부파일로 저장해요. 영상과 강의자료실은 아직 제외됩니다. 출결은 출결 현황 화면을 연 뒤 가져오세요.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="update" role="status"></p>
  <script type="module" src="popup.js"></script>
</body></html>
