<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Argos</title>
    <style>
      :root { --page: #f7f7f7; --ink: #111118; --meta: #8a8a93; --danger: #c2410c; }
      @media (prefers-color-scheme: dark) {
        :root { --page: #1c1c27; --ink: #f2f2f5; --meta: #8d8d9c; --danger: #fb923c; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: var(--page); color: var(--ink);
        font: 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      }
      img { width: 72px; height: 72px; }
      #status { color: var(--meta); max-width: 440px; text-align: center; line-height: 1.6; }
      #status.failed { color: var(--danger); }
    </style>
  </head>
  <body>
    <img src="icon.png" alt="" />
    <div id="status">Argos를 시작하는 중…</div>
    <script>
      // The app (src-tauri/src/lib.rs) reports progress and errors here.
      window.setStatus = (text, failed) => {
        const el = document.getElementById("status");
        el.textContent = text;
        el.classList.toggle("failed", failed);
      };
    </script>
  </body>
</html>
