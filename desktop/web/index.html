<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Argos</title>
    <style>
      :root { --page: #f7f7f7; --ink: #111118; --meta: #8a8a93; --danger: #c2410c; --bubble: #ffffff; --line: #e4e4e7; }
      @media (prefers-color-scheme: dark) {
        :root { --page: #1c1c27; --ink: #f2f2f5; --meta: #8d8d9c; --danger: #fb923c; --bubble: #26263a; --line: #34344a; }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: var(--page); color: var(--ink);
        font: 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        -webkit-user-select: none; user-select: none; cursor: default;
      }
      .stage { position: relative; width: 260px; height: 150px; }

      /* Argos hops in, lands with a little squash, then wags. */
      .dog {
        position: absolute; left: 94px; bottom: 18px; width: 72px; height: 72px;
        transform-origin: 50% 100%;
        animation: hop-in 0.7s cubic-bezier(0.3, 1.4, 0.6, 1) 0.9s both,
                   wag 0.5s ease-in-out 1.7s 3;
      }
      .dog img { width: 100%; height: 100%; display: block; }
      @keyframes hop-in {
        0% { opacity: 0; transform: translateY(-46px) scale(0.8); }
        55% { opacity: 1; transform: translateY(0) scale(1.08, 0.9); }
        75% { transform: translateY(-8px) scale(0.97, 1.04); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes wag {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-7deg); }
        75% { transform: rotate(7deg); }
      }

      /* Its paw prints trot in from the left, then fade. */
      .paws { position: absolute; left: 0; bottom: 24px; display: flex; gap: 6px; color: var(--ink); }
      .paws svg { width: 18px; height: 18px; opacity: 0; animation: step 1.1s ease-out both; }
      .paws svg:nth-child(odd) { transform: translateY(-5px) rotate(90deg); }
      .paws svg:nth-child(even) { transform: translateY(5px) rotate(90deg); }
      .paws svg:nth-child(1) { animation-delay: 0s; }
      .paws svg:nth-child(2) { animation-delay: 0.18s; }
      .paws svg:nth-child(3) { animation-delay: 0.36s; }
      .paws svg:nth-child(4) { animation-delay: 0.54s; }
      @keyframes step { 0% { opacity: 0; } 20% { opacity: 0.75; } 70% { opacity: 0.5; } 100% { opacity: 0; } }

      /* Then says hello. */
      .bubble {
        position: absolute; left: 150px; top: 0; padding: 7px 12px; border-radius: 14px;
        background: var(--bubble); border: 1px solid var(--line); color: var(--ink);
        font-size: 13.5px; font-weight: 500; white-space: nowrap;
        transform-origin: 0% 100%;
        animation: pop 0.35s cubic-bezier(0.3, 1.5, 0.6, 1) 1.55s both;
      }
      .bubble::after {
        content: ""; position: absolute; left: 10px; bottom: -6px; width: 10px; height: 10px;
        background: var(--bubble); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
        transform: rotate(45deg);
      }
      @keyframes pop { 0% { opacity: 0; transform: scale(0.4); } 100% { opacity: 1; transform: scale(1); } }

      #status {
        color: var(--meta); max-width: 440px; min-height: 22px; text-align: center; line-height: 1.6;
        animation: fade 0.4s ease 2s both;
      }
      #status.failed { color: var(--danger); animation: none; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .dog, .bubble, #status { animation: none; }
        .paws { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <div class="paws">
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.6" rx="4.3" ry="3.7"/><circle cx="6.3" cy="10.4" r="1.9"/><circle cx="9.9" cy="6.8" r="1.9"/><circle cx="14.1" cy="6.8" r="1.9"/><circle cx="17.7" cy="10.4" r="1.9"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.6" rx="4.3" ry="3.7"/><circle cx="6.3" cy="10.4" r="1.9"/><circle cx="9.9" cy="6.8" r="1.9"/><circle cx="14.1" cy="6.8" r="1.9"/><circle cx="17.7" cy="10.4" r="1.9"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.6" rx="4.3" ry="3.7"/><circle cx="6.3" cy="10.4" r="1.9"/><circle cx="9.9" cy="6.8" r="1.9"/><circle cx="14.1" cy="6.8" r="1.9"/><circle cx="17.7" cy="10.4" r="1.9"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.6" rx="4.3" ry="3.7"/><circle cx="6.3" cy="10.4" r="1.9"/><circle cx="9.9" cy="6.8" r="1.9"/><circle cx="14.1" cy="6.8" r="1.9"/><circle cx="17.7" cy="10.4" r="1.9"/></svg>
      </div>
      <div class="dog"><img src="icon.png" alt="" /></div>
      <div class="bubble" id="hello">반가워요!</div>
    </div>
    <div id="status">Argos를 준비하는 중…</div>
    <script>
      // A greeting for the time of day.
      const hour = new Date().getHours();
      document.getElementById("hello").textContent =
        hour >= 5 && hour < 11 ? "좋은 아침이에요!" :
        hour >= 18 && hour < 23 ? "좋은 저녁이에요!" :
        hour >= 23 || hour < 5 ? "늦게까지 수고해요!" : "반가워요!";
      // The app (src-tauri/src/lib.rs) reports progress and errors here.
      window.setStatus = (text, failed) => {
        const el = document.getElementById("status");
        el.textContent = text;
        el.classList.toggle("failed", failed);
      };
    </script>
  </body>
</html>
