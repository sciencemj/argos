[package]
name = "argos-desktop"
version = "0.1.2"
description = "Argos desktop app: runs the Argos server and shows it in a window"
authors = ["sciencemj"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "argos_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Quick capture gives focus back to the app the user was in; uninstall moves files to
# the Trash (recoverable) instead of deleting them.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSString", "NSError"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Stripping only the app: stripped proc-macro dylibs fail to load on macOS 27
# ("mis-aligned LINKEDIT string pool").
strip = true

[profile.release.build-override]
strip = false
