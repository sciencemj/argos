name: Release

# Push a tag like v0.2.0 (`make release VERSION=0.2.0`). Builds the macOS app, signs the
# update with the updater key, and publishes a GitHub release whose latest.json the
# installed apps poll (desktop/src-tauri/src/update.rs).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15 # Apple silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Tag matches the app version
        run: |
          version=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != app version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cd backend && uv sync --locked --group desktop
      - run: cd frontend && bun install --frozen-lockfile
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: make app
      - name: Collect files and latest.json
        run: |
          bundle=desktop/src-tauri/target/release/bundle/macos
          mkdir -p out
          cp "$bundle/Argos.app.tar.gz" out/Argos_aarch64.app.tar.gz
          cp "$bundle/Argos.app.tar.gz.sig" out/Argos_aarch64.app.tar.gz.sig
          cp desktop/build/Argos.dmg "out/Argos_${VERSION}_aarch64.dmg"
          python3 - <<'PY'
          import json, os, datetime
          version = os.environ["VERSION"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}"
          manifest = {
              "version": version,
              "notes": f"Argos {version}",
              "pub_date": datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": open("out/Argos_aarch64.app.tar.gz.sig").read().strip(),
                      "url": f"{base}/Argos_aarch64.app.tar.gz",
                  }
              },
          }
          json.dump(manifest, open("out/latest.json", "w"), indent=2)
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Argos $VERSION" --generate-notes
